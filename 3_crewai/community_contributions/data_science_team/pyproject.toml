[project]
name = "data_science_crew"
version = "0.1.0"
description = "data_science_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
data_science_crew = "data_science_crew.main:run"
run_crew = "data_science_crew.main:run"
train = "data_science_crew.main:train"
replay = "data_science_crew.main:replay"
test = "data_science_crew.main:test"
run_with_trigger = "data_science_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = [
    "sandbox",
]
