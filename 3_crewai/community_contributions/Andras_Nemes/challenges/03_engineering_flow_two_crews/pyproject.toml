[project]
name = 'engineering_flow_two_crews'
version = '0.1.0'
description = 'A beginner Flow coordinating backend and test crews'
authors = [{ name = 'Andras Nemes' }]
requires-python = '>=3.10,<3.14'
dependencies = [
    'crewai[tools]==1.14.4'
]

[project.scripts]
kickoff = 'engineering_flow_two_crews.main:kickoff'
plot = 'engineering_flow_two_crews.main:plot'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.crewai]
type = 'flow'
