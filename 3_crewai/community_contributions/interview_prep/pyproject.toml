[project]
name = "interview_prep"
version = "0.1.0"
description = "interview_prep using crewAI"
authors = [{ name = "Shivam Garg", email = "shivamgarg1042@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
interview_prep = "interview_prep.main:run"
run_crew = "interview_prep.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
