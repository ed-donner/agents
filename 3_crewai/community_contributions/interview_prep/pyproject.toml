[project]
name = "interview_prep"
version = "0.1.0"
description = "interview_prep using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.4",
]

[project.scripts]
interview_prep = "interview_prep.main:run"
run_crew = "interview_prep.main:run"
train = "interview_prep.main:train"
replay = "interview_prep.main:replay"
test = "interview_prep.main:test"
run_with_trigger = "interview_prep.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
